<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0F1E">
<title>Shield Up</title>
<meta name="description" content="Shield Up: the CyberSecTOBER awareness game. Practise real-life security decisions, protect your market, church, mosque, school or family with an awareness kit, build a squad and earn real badges by contributing.">
<meta property="og:title" content="Shield Up · CyberSecTOBER">
<meta property="og:description" content="Protect your people. Earn real badges.">
<meta property="og:image" content="https://raw.githubusercontent.com/CyberSecTober/Cybersectober/main/badges/share-card-template.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--bg2:#0E1528;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--text:#F4F6FB;--muted:#8D96AE;--green:#3DDC97;--violet:#8B7CFF;--amber:#FFB547;--rose:#FF5D7A;--sky:#4CC9F0;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05070F;color:var(--text);font:500 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--green)}
#app{position:relative;max-width:460px;height:100dvh;margin:0 auto;overflow:hidden;background:radial-gradient(900px 500px at 110% -10%,rgba(139,124,255,.22),transparent 60%),radial-gradient(700px 500px at -20% 30%,rgba(61,220,151,.12),transparent 60%),var(--bg)}
@media(min-width:520px){#app{height:min(900px,96dvh);margin-top:2dvh;border-radius:34px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.scroll{position:absolute;inset:0 0 78px;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 28px}
.scroll::-webkit-scrollbar,.stagebody::-webkit-scrollbar{display:none}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h1{font-size:28px}h2{font-size:21px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:"JetBrains Mono",monospace}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 2px 12px}
.sec button{font-size:13px;color:var(--muted);background:none;border:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--glass2);color:var(--text)}
.chip.g{background:rgba(61,220,151,.14);color:var(--green)}.chip.v{background:rgba(139,124,255,.16);color:#B8AEFF}.chip.a{background:rgba(255,181,71,.15);color:var(--amber)}.chip.r{background:rgba(255,93,122,.14);color:#FF8DA3}.chip.s{background:rgba(76,201,240,.14);color:var(--sky)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;background:var(--green);color:#04170E;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--glass2);color:var(--text)}.btn.violet{background:var(--violet);color:#fff}.btn.amber{background:var(--amber);color:#2A1A00}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.ico{width:22px;height:22px;flex:none}
input,textarea{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--text);font:600 15px "Plus Jakarta Sans",sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(61,220,151,.15)}
.lbl{display:block;font-size:13px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
/* Home */
.hello{display:flex;align-items:center;gap:12px}
.ava{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#04170E;background:linear-gradient(135deg,var(--green),var(--sky));flex:none}
.hello .t{flex:1;min-width:0}.hello .t b{display:block;font-size:19px}.hello .t span{font-size:13px;color:var(--muted)}
.streak{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:14px;background:rgba(255,181,71,.12);color:var(--amber);font-weight:800}
.levelcard{margin-top:18px;padding:18px;display:flex;align-items:center;gap:16px}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1}
.ring b small{font-size:9px;color:var(--muted);letter-spacing:.14em;margin-top:4px}
.levelcard .t b{display:block;font-size:18px}.levelcard .t span{font-size:13px;color:var(--muted)}
.hero{position:relative;overflow:hidden;margin-top:14px;padding:20px;border-radius:26px;background:linear-gradient(135deg,#5B4BDB 0%,#2A1E7A 55%,#122a4a 100%);border:1px solid rgba(255,255,255,.12)}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(61,220,151,.5),transparent 65%)}
.hero .k{font-size:11px;font-weight:800;letter-spacing:.16em;color:#CFC8FF;position:relative;z-index:1}
.hero h2{margin:6px 0;font-size:22px;position:relative;z-index:1}.hero p{margin:0 0 14px;color:#D9D4FF;font-size:14px;position:relative;z-index:1}
.hero .btn{position:relative;z-index:1}
.comms{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:2px 18px 6px;scroll-snap-type:x mandatory}
.comms::-webkit-scrollbar{display:none}
.comm{flex:0 0 152px;scroll-snap-align:start;padding:14px;border-radius:22px;text-align:left;border:1px solid var(--line);background:var(--glass)}
.ci{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.comm b{display:block;font-size:15px}.comm span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step:not(:last-child):before{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.step .n{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--glass2);flex:none;border:1px solid var(--line)}
.step.done .n{background:var(--green);color:#04170E;border-color:var(--green)}
.step.now .n{background:var(--violet);color:#fff;border-color:var(--violet);box-shadow:0 0 0 5px rgba(139,124,255,.2)}
.step b{display:block;font-size:15px}.step span{font-size:13px;color:var(--muted)}
/* Missions */
.filters{display:flex;gap:8px;overflow-x:auto;margin:16px -18px 4px;padding:0 18px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.mis{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:22px;border:1px solid var(--line);background:var(--glass);text-decoration:none;color:var(--text)}
.mi{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;justify-content:center;flex:none}
.mis .tx{flex:1;min-width:0}.mis b{display:block;font-size:15px}.mis .tx>span{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
.mis .go{width:34px;height:34px;border-radius:50%;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex:none}
.mis.done .go{background:var(--green);color:#04170E}
.cats{display:flex;gap:6px;flex-wrap:wrap}
/* Tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:78px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,15,30,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);z-index:5}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tabs button.on{color:var(--text)}.tabs button.on .ico{color:var(--green)}
.tabs button.on:before{content:"";position:absolute;top:-8px;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--green)}
/* Stage */
.stage{position:absolute;inset:0;z-index:20;background:var(--bg);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.stage.on{transform:none}
.stagehead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
.back{width:40px;height:40px;border-radius:14px;background:var(--glass2);border:0;display:flex;align-items:center;justify-content:center}
.stagehead .t{flex:1;min-width:0}.stagehead .t b{display:block;font-size:16px}.stagehead .t span{font-size:12px;color:var(--muted)}
.stagebody{flex:1;overflow-y:auto;padding:4px 18px 30px}
.prog{height:6px;border-radius:99px;background:var(--glass2);overflow:hidden;margin:0 18px 12px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--sky));transition:width .4s;width:0}
.scene{padding:18px;border-radius:24px;background:linear-gradient(160deg,rgba(139,124,255,.16),rgba(76,201,240,.06));border:1px solid var(--line)}
.scene .k{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.scene p{font-size:17px;font-weight:700;margin:8px 0 0;line-height:1.45}
.choice{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);margin-top:10px;font-weight:700;font-size:15px}
.choice .l{width:30px;height:30px;border-radius:10px;background:var(--glass2);display:flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.choice.ok{border-color:var(--green);background:rgba(61,220,151,.1)}.choice.ok .l{background:var(--green);color:#04170E}
.choice.bad{border-color:var(--rose);background:rgba(255,93,122,.1)}.choice.bad .l{background:var(--rose);color:#fff}
.explain{margin-top:12px;padding:14px;border-radius:18px;font-size:14px;animation:rise .3s}
.explain.good{background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3)}.explain.bad{background:rgba(255,93,122,.1);border:1px solid rgba(255,93,122,.3)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* SOC */
.alert{display:flex;gap:12px;padding:14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);margin-top:10px;animation:rise .3s}
.sev{width:6px;border-radius:99px;flex:none}
.alert .tx{flex:1}.alert b{display:block;font-size:14px}.alert .mono{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:10px}.acts .btn{padding:9px 12px;font-size:13px;border-radius:12px;flex:1}
.alert.ok{border-color:rgba(61,220,151,.45)}.alert.bad{border-color:rgba(255,93,122,.45)}
.timer{height:4px;border-radius:99px;background:var(--glass2);overflow:hidden;margin-top:10px}.timer i{display:block;height:100%;background:var(--amber);width:100%}
/* Password lab */
.meter{height:12px;border-radius:99px;background:var(--glass2);overflow:hidden;margin:14px 0 6px}.meter i{display:block;height:100%;border-radius:99px;transition:width .3s,background .3s;width:0}
.crack{font-size:26px;font-weight:800;margin-top:6px}
.checks div{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:8px;color:var(--muted)}
.checks div.ok{color:var(--text)}.checks i{width:20px;height:20px;border-radius:50%;background:var(--glass2);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800}
.checks div.ok i{background:var(--green);color:#04170E}
/* Teach */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);text-align:left}
.opt.on{border-color:var(--green);background:rgba(61,220,151,.08);box-shadow:0 0 0 3px rgba(61,220,151,.12)}
.opt b{display:block;font-size:15px}.opt span{font-size:12px;color:var(--muted)}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--glass);margin-top:8px;text-align:left;width:100%;font-size:14px}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:800}
.tip.on{border-color:rgba(61,220,151,.5)}.tip.on .box,.cl.on .box{background:var(--green);border-color:var(--green);color:#04170E}
.kit{border-radius:26px;padding:22px;background:linear-gradient(150deg,#3DDC97 0%,#1BA38A 45%,#1C3D6E 100%);color:#04170E}
.kit .k{font-size:11px;font-weight:800;letter-spacing:.16em;opacity:.75}
.kit h2{font-size:23px;margin:6px 0 12px;color:#04170E}
.kit ol{margin:0;padding-left:20px;font-weight:700;font-size:15px}.kit li{margin:8px 0}
.kit .foot{margin-top:14px;font-size:12px;font-weight:700;opacity:.8}
.cl{display:flex;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
/* Squad & rewards */
.member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.member img,.member .ph{width:38px;height:38px;border-radius:12px;background:var(--glass2);flex:none}
.member b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.member .pts{font-weight:800}
.member .x{background:none;border:0;color:var(--muted);font-size:18px;padding:0 4px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{padding:14px 8px;border-radius:20px;text-align:center;border:1px solid var(--line);background:var(--glass)}
.medal .m{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.medal b{display:block;font-size:12px;line-height:1.3}.medal.off{opacity:.3}
.realbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.realbadges img{width:100%;border-radius:12px;display:block}
/* Overlays */
.sheet{position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(3,6,14,.62);backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheet .sbox{width:100%;max-height:92%;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 16px}
.win{text-align:center}
.burst{width:110px;height:110px;margin:4px auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(61,220,151,.35),transparent 70%)}
.win .xp{font-size:40px;font-weight:800;color:var(--green);margin:4px 0}
.toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:800;font-size:14px;white-space:nowrap;animation:tin .3s, tout .3s 2.2s forwards;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-10px)}}@keyframes tout{to{opacity:0;transform:translate(-50%,-10px)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg)}}
/* Onboarding */
.onb{position:absolute;inset:0;z-index:50;background:radial-gradient(700px 500px at 100% 0%,rgba(139,124,255,.3),transparent 60%),radial-gradient(600px 500px at 0% 100%,rgba(61,220,151,.18),transparent 60%),var(--bg);display:none;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));overflow-y:auto}
.onb.on{display:flex}
.onb .art{flex:1;display:flex;align-items:center;justify-content:center;min-height:200px}
.onb h1{font-size:30px}.onb p{color:var(--muted);font-size:16px;margin:10px 0 0}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots i{width:8px;height:8px;border-radius:99px;background:var(--glass2);transition:width .3s}.dots i.on{width:24px;background:var(--green)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.02em}
.orb{width:220px;height:220px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.18),rgba(139,124,255,.18) 40%,rgba(61,220,151,.08) 70%,transparent 72%);position:relative}
.orb:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(255,255,255,.14);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <div class="scroll" id="view"></div>
  <nav class="tabs" id="tabs">
    <button data-t="home" class="on"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>Home</button>
    <button data-t="missions"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Missions</button>
    <button data-t="squad"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M15 14.6c2.6-.3 5 1.2 5.8 4.4"/></svg>Squad</button>
    <button data-t="rewards"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/></svg>Rewards</button>
  </nav>
  <div class="stage" id="stage"><div class="stagehead"><button class="back" id="back" aria-label="Back"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="t"><b id="stTitle"></b><span id="stSub"></span></div></div><div class="prog"><i id="stProg"></i></div><div class="stagebody" id="stBody"></div></div>
  <div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
  <div class="onb" id="onb"></div>
</div>

<script>
(function () {
  "use strict";
  var REPO = "https://github.com/CyberSecTober/Cybersectober", SAVE = "shield-up-v1";
  var $ = function (id) { return document.getElementById(id); };
  var store = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function today() { return new Date().toISOString().slice(0, 10); }
  function validUser(u) { return /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,38})$/.test(u); }
  function cleanUser(u) { return String(u || "").trim().replace(/^@/, "").replace(/^https?:\/\/github\.com\//i, "").replace(/\/.*$/, ""); }

  function bind() {

  // ------------------------------------------------------------ Stage & missions
  function stage(title, sub) { $("stTitle").textContent = title; $("stSub").textContent = sub || ""; $("stProg").style.width = "0"; $("stBody").scrollTop = 0; $("stage").classList.add("on"); }
  function closeStage() { $("stage").classList.remove("on"); render(); }
  $("back").onclick = closeStage;
  function prog(p) { $("stProg").style.width = p + "%"; }
  function win(m, score, total, extra) {
    var best = S.done[m.id] ? +String(S.done[m.id]).split("/")[0] : -1, gain = 0;
    if (score > best) { gain = Math.round(m.xp * (best < 0 ? score / total : (score - best) / total)); S.done[m.id] = score + "/" + total; S.xp += gain; }
    if (S.days.indexOf(today()) === -1) S.days.push(today());
    var lvBefore = level() - (Math.floor((S.xp - gain) / 200) < level() ? 1 : 0);
    save(); if (score === total) confetti();
    sheet('<div class="win"><div class="burst">' + ic(score === total ? "trophy" : "shield", "#3DDC97", 54) + "</div><h2>" + (score === total ? "Perfect!" : score / total >= .5 ? "Mission complete" : "Good effort") + '</h2><p class="muted">' + score + " of " + total + " correct</p>" + (gain ? '<div class="xp">+' + gain + " XP</div>" : '<p class="small muted">Beat your best score to earn more XP.</p>') +
      (level() > lvBefore ? '<p><span class="chip v">Level up: ' + LEVELS[level()] + "</span></p>" : "") + (extra || "") + '<button class="btn block" data-close id="wclose">Continue</button></div>');
    $("wclose").onclick = function () { closeSheet(); closeStage(); };

  function start(id) {

  }

  // Multiple-choice runner used by decisions and the red team lab
  function quiz(m, items, kicker, note) {
    var i = 0, right = 0;
    stage(m.title, kicker);
    function q() {
      prog(i / items.length * 100);
      var it = items[i], opts = shuffle(it.o.map(function (o, j) { return { t: o, ok: j === (it.a || 0) }; }));
      $("stBody").innerHTML = (note && i === 0 ? note : "") + '<div class="scene"><div class="k">' + kicker.toUpperCase() + " · " + (i + 1) + " OF " + items.length + "</div><p>" + esc(it.s) + "</p></div>" +
        opts.map(function (o, j) { return '<button class="choice" data-ok="' + (o.ok ? 1 : 0) + '"><span class="l">' + "ABC"[j] + "</span>" + esc(o.t) + "</button>"; }).join("") + '<div id="ex"></div>';
      $("stBody").querySelectorAll(".choice").forEach(function (b) {
        b.onclick = function () {
          if ($("ex").innerHTML) return; var ok = b.dataset.ok === "1"; if (ok) right++;
          $("stBody").querySelectorAll(".choice").forEach(function (x) { if (x.dataset.ok === "1") x.classList.add("ok"); });
          if (!ok) b.classList.add("bad");
          $("ex").innerHTML = '<div class="explain ' + (ok ? "good" : "bad") + '"><b>' + (ok ? "Nice one." : "Not quite.") + "</b> " + esc(it.why) + '</div><button class="btn block" style="margin-top:12px" id="nx">' + (i + 1 < items.length ? "Next" : "Finish") + "</button>";
          $("nx").onclick = function () { i++; if (i < items.length) q(); else { prog(100); win(m, right, items.length); } };
          $("nx").scrollIntoView({ behavior: "smooth", block: "nearest" });
        };
      });
    }
    q();
  }
  function decide(m) { quiz(m, shuffle(DECIDE[m.comm]), "What would you do?"); }
  function redteam(m) { quiz(m, shuffle(REDTEAM).slice(0, 4), "Find the flaw", '<div class="glass pad small" style="margin-bottom:12px;color:var(--muted)">' + ic("shield", "#3DDC97", 16) + " Practice targets only. Real ethical hackers test only systems they own or have written permission to test.</div>"); }

  function soc(m) {
    stage(m.title, "Escalate real threats, close the noise");
    var items = shuffle(SOC).slice(0, 6), i = 0, right = 0, raf = null;
    $("stBody").innerHTML = '<div class="glass pad small muted">Alerts arrive one at a time. You have 8 seconds for each. Escalate the threats, close the routine ones.</div><div id="feed"></div>';
    function next() {
      prog(i / items.length * 100);
      if (i >= items.length) { prog(100); return setTimeout(function () { win(m, right, items.length); }, 500); }
      var it = items[i], el = document.createElement("div"); el.className = "alert";
      el.innerHTML = '<span class="sev" style="background:' + ["#FFB547", "#FF5D7A", "#4CC9F0"][i % 3] + '"></span><div class="tx"><span class="mono">ALERT #' + (1042 + i) + " · " + new Date().toTimeString().slice(0, 5) + "</span><b>" + esc(it.s) + '</b><div class="timer"><i></i></div><div class="acts"><button class="btn" style="background:#FF5D7A;color:#fff" data-v="1">Escalate</button><button class="btn ghost" data-v="0">Close</button></div></div>';
      $("feed").prepend(el);
      var t0 = performance.now(), bar = el.querySelector(".timer i");
      (function tick() { var p = 1 - (performance.now() - t0) / 8000; bar.style.width = Math.max(0, p * 100) + "%"; if (p <= 0) answer(-1); else raf = requestAnimationFrame(tick); })();
      function answer(v) {
        cancelAnimationFrame(raf); if (el.dataset.done) return; el.dataset.done = 1;
        var ok = v === it.bad; if (ok) right++;
        el.classList.add(ok ? "ok" : "bad");
        el.querySelector(".acts").outerHTML = '<div class="small" style="margin-top:8px;color:' + (ok ? "var(--green)" : "#FF8DA3") + '"><b>' + (v === -1 ? "Too slow." : ok ? "Correct." : "Missed.") + "</b> " + esc(it.why) + "</div>";
        el.querySelector(".timer").remove(); i++; setTimeout(next, 900);
      }
      el.querySelectorAll("[data-v]").forEach(function (b) { b.onclick = function () { answer(+b.dataset.v); }; });
    }
    next();
  }

  function password(m) {
    stage(m.title, "Make it long, unique and memorable");
    var COMMON = ["password", "123456", "qwerty", "iloveyou", "admin", "welcome", "naija", "jesus", "god", "love", "money", "letmein", "abc123", "football", "arsenal", "chelsea"];
    $("stBody").innerHTML = '<div class="glass pad"><label class="lbl" for="pw" style="margin-top:0">Try a passphrase (it never leaves your phone)</label><input id="pw" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. mango-danfo-rainy-tuesday"><div class="meter"><i id="pm"></i></div><div class="small muted">Time to crack</div><div class="crack" id="pc">-</div>' +
      '<div class="checks" id="pk" style="margin-top:10px"></div></div><div class="glass pad small muted" style="margin-top:12px">Tip: four random words you can picture are stronger and easier to remember than <span class="mono">P@ssw0rd!</span>. Never reuse it, and turn on 2-step verification.</div><button class="btn block" id="pdone" style="margin-top:14px" disabled>Strong enough, finish</button>';
    function est(p) {
      var pool = 0; if (/[a-z]/.test(p)) pool += 26; if (/[A-Z]/.test(p)) pool += 26; if (/[0-9]/.test(p)) pool += 10; if (/[^A-Za-z0-9]/.test(p)) pool += 33;
      var bits = p.length * Math.log2(pool || 1), low = p.toLowerCase();
      if (COMMON.some(function (w) { return low.indexOf(w) !== -1; })) bits -= 25;
      if (/(.)\1\1/.test(p)) bits -= 10; if (/^[a-z]+[0-9]{1,4}$/i.test(p)) bits -= 15;
      var words = p.split(/[\s\-_.,]+/).filter(function (w) { return w.length >= 3; }).length;
      if (words >= 4) bits = Math.max(bits, 60 + words * 6);
      return { bits: Math.max(0, bits), words: words };
    }
    function human(bits) { var s = Math.pow(2, bits) / 1e10; if (s < 1) return "Instantly"; var u = [[31536000 * 1000, "thousand years"], [31536000 * 100, "centuries"], [31536000, "years"], [2592000, "months"], [86400, "days"], [3600, "hours"], [60, "minutes"], [1, "seconds"]]; for (var i = 0; i < u.length; i++) if (s >= u[i][0]) { var n = Math.round(s / u[i][0]); return (u[i][1] === "centuries" || u[i][1] === "thousand years") && n > 999 ? "Longer than history" : n + " " + u[i][1]; } return "Seconds"; }
    $("pw").oninput = function () {
      var p = this.value, e = est(p), pct = Math.min(100, e.bits / 80 * 100), col = pct < 35 ? "#FF5D7A" : pct < 70 ? "#FFB547" : "#3DDC97";
      $("pm").style.width = pct + "%"; $("pm").style.background = col; $("pc").textContent = p ? human(e.bits) : "-"; $("pc").style.color = col;
      var low = p.toLowerCase(), checks = [[p.length >= 14, "14 characters or more"], [e.words >= 4 || /[^A-Za-z0-9]/.test(p), "4+ words, or a mix of symbols"], [p && !COMMON.some(function (w) { return low.indexOf(w) !== -1; }), "No common words like password, naija or 123456"], [p && !/(.)\1\1/.test(p), "No repeated characters like aaa"]];
      $("pk").innerHTML = checks.map(function (c) { return '<div class="' + (c[0] ? "ok" : "") + '"><i>' + (c[0] ? "✓" : "") + "</i>" + c[1] + "</div>"; }).join("");
      var ok = checks.every(function (c) { return c[0]; }) && pct >= 70; $("pdone").disabled = !ok; prog(ok ? 100 : pct * .9);
    };
    $("pw").oninput.call({ value: "" });
    $("pdone").onclick = function () { win(m, 1, 1); };
  }

  // ------------------------------------------------------------ Teach: awareness kit + session

        '<p class="small muted" style="margin-top:12px">Want it in Yoruba, Hausa, Igbo or another language? Translate your kit and submit it for the Community Defender badge.</p><button class="btn block" id="s2" style="margin-top:12px"' + (k.tips.length === 3 ? "" : " disabled") + ">Preview my kit</button>";
      $("stBody").querySelectorAll("[data-lang]").forEach(function (b) { b.onclick = function () { k.lang = b.dataset.lang; step1(); }; });
      $("stBody").querySelectorAll("[data-tip]").forEach(function (b) { b.onclick = function () { var t = b.dataset.tip, i = k.tips.indexOf(t); if (i !== -1) k.tips.splice(i, 1); else if (k.tips.length < 3) k.tips.push(t); else return toast("Pick only 3. Untick one first."); step1(); }; });
      $("s2").onclick = step2;
    }
    function kitText() { return (k.lang === "pcm" ? "Make you stay safe from scam" : "Stay safe from scams") + " · " + c.name + "\n\n" + k.tips.map(function (t, i) { return (i + 1) + ". " + TIPS[t][k.lang]; }).join("\n") + "\n\n#CyberSecTOBER · cybersectober.github.io/Cybersectober"; }
    function step2() {
      prog(45); S.kits[c.id] = k; save();
      $("stBody").innerHTML = '<div class="kit" id="kit"><div class="k">CYBERSECTOBER · ' + esc(c.name.toUpperCase()) + "</div><h2>" + (k.lang === "pcm" ? "Make you stay safe from scam" : "Stay safe from scams") + "</h2><ol>" + k.tips.map(function (t) { return "<li>" + esc(TIPS[t][k.lang]) + "</li>"; }).join("") + '</ol><div class="foot">#CyberSecTOBER · cybersectober.github.io/Cybersectober</div></div>' +
        '<div class="row" style="margin-top:14px"><button class="btn ghost" id="dl">' + ic("download", null, 18) + 'Image</button><a class="btn ghost" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(kitText()) + '">' + ic("share", null, 18) + "WhatsApp</a></div>" +
        '<button class="btn block" id="s3" style="margin-top:12px">Plan my session</button>';
      $("dl").onclick = function () { downloadKit(c, k); };
      $("s3").onclick = step3;
    }
    function step3() {
      prog(70);
      var items = ["Pick a day and place: after service, market day, assembly or a family call", "Invite people (share your kit in the group first)", "Share your 3 tips, one at a time, with a real story", "Ask: has anyone ever received a message like this? Let people talk", "Agree one action together, like a family code word or 'confirm in the app'"];
      $("stBody").innerHTML = '<h2>Run your session</h2><p class="muted small" style="margin:6px 0 4px">15 minutes with 5 people counts. Tick as you go.</p><div class="glass pad" style="padding-top:2px;padding-bottom:2px">' +
        items.map(function (t, i) { var on = k.checks.indexOf(i) !== -1; return '<button class="cl' + (on ? " on" : "") + '" data-ci="' + i + '"><i class="box">' + (on ? "✓" : "") + "</i><span>" + esc(t) + "</span></button>"; }).join("") + "</div>" +
        '<div class="glass pad small muted" style="margin-top:12px">Keep people safe: no full names, phone numbers or photos of children in anything you share.</div>' +
        '<button class="btn block" id="fin" style="margin-top:14px">' + (k.checks.length === items.length ? "I ran it! Report my session" : "Finish for now") + "</button>";
      $("stBody").querySelectorAll("[data-ci]").forEach(function (b) { b.onclick = function () { var i = +b.dataset.ci, j = k.checks.indexOf(i); if (j === -1) k.checks.push(i); else k.checks.splice(j, 1); S.kits[c.id] = k; save(); prog(70 + k.checks.length * 6); step3(); }; });
      $("fin").onclick = function () {
        var ran = k.checks.length === items.length;
        win(m, ran ? 2 : 1, 2, ran ? '<button class="btn violet block" id="rep" style="margin-bottom:10px">' + ic("git", "#fff", 18) + "Report it for a real badge</button>" : '<p class="small muted">Come back and tick everything once you\'ve run your session.</p>');
        if ($("rep")) $("rep").onclick = function () { closeSheet(); closeStage(); reportFlow(c.id); };
      };
    }
    step1();
  }
  function downloadKit(c, k) {
    var W = 1080, H = 1350, cv = document.createElement("canvas"); cv.width = W; cv.height = H; var g = cv.getContext("2d");
    var gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#3DDC97"); gr.addColorStop(.45, "#1BA38A"); gr.addColorStop(1, "#1C3D6E"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = "rgba(4,23,14,.75)"; g.font = "800 34px 'Plus Jakarta Sans', sans-serif"; g.fillText("CYBERSECTOBER · " + c.name.toUpperCase(), 90, 150);
    g.fillStyle = "#04170E"; g.font = "800 84px 'Plus Jakarta Sans', sans-serif"; wrap(g, k.lang === "pcm" ? "Make you stay safe from scam" : "Stay safe from scams", 90, 270, W - 180, 96);
    var y = 520; g.font = "700 46px 'Plus Jakarta Sans', sans-serif";
    k.tips.forEach(function (t, i) { g.fillStyle = "rgba(4,23,14,.15)"; g.beginPath(); g.arc(120, y - 16, 38, 0, 7); g.fill(); g.fillStyle = "#04170E"; g.font = "800 40px 'Plus Jakarta Sans'"; g.fillText(String(i + 1), 108, y); g.font = "700 44px 'Plus Jakarta Sans'"; y = wrap(g, TIPS[t][k.lang], 190, y, W - 290, 58) + 70; });
    g.fillStyle = "rgba(4,23,14,.8)"; g.font = "700 32px 'Plus Jakarta Sans'"; g.fillText("#CyberSecTOBER · cybersectober.github.io/Cybersectober", 90, H - 90);
    var a = document.createElement("a"); a.download = "cybersectober-" + c.id + "-kit.png"; a.href = cv.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove(); toast("Kit image saved");
  }
  function wrap(g, text, x, y, maxW, lh) { var words = text.split(" "), line = ""; words.forEach(function (w) { var t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; } else line = t; }); g.fillText(line, x, y); return y; }

  // ------------------------------------------------------------ Report a session (real contribution)
  function reportFlow(commId) {
    var c = COMMS.filter(function (x) { return x.id === (commId || S.focus); })[0] || COMMS[0], k = S.kits[c.id];
    sheet('<h2>Report your session</h2><p class="muted small" style="margin:6px 0 0">This opens GitHub with your report already written. A mentor reviews it and your squad earns real points and the Community Defender badge.</p>' +
      '<div class="lbl">Community</div><div class="opts">' + COMMS.map(function (x) { return '<button class="opt' + (x.id === c.id ? " on" : "") + '" data-rc="' + x.id + '"><b>' + esc(x.name) + "</b></button>"; }).join("") + "</div>" +
      '<label class="lbl" for="rp">Where? (no addresses)</label><input id="rp" placeholder="e.g. a fabric market in Yaba">' +
      '<div class="row"><div><label class="lbl" for="rn">People reached</label><input id="rn" type="number" min="1" placeholder="25"></div><div><label class="lbl" for="rd">Date</label><input id="rd" type="date" value="' + today() + '"></div></div>' +
      '<label class="lbl" for="rq">What did people ask or share?</label><textarea id="rq" rows="3" placeholder="e.g. Two traders had received fake payment screenshots last month."></textarea>' +
      '<label class="lbl" for="ru">Your GitHub username</label><input id="ru" value="' + esc(S.github) + '" placeholder="your-username" autocapitalize="off">' +
      '<button class="btn block" id="go" style="margin-top:16px">' + ic("git", "#04170E", 18) + "Open my report on GitHub</button><p class=\"small muted\" style=\"text-align:center\">Then press Commit changes → Propose changes → Create pull request.</p>");
    $("sbox").querySelectorAll("[data-rc]").forEach(function (b) { b.onclick = function () { c = COMMS.filter(function (x) { return x.id === b.dataset.rc; })[0]; k = S.kits[c.id]; $("sbox").querySelectorAll("[data-rc]").forEach(function (o) { o.classList.toggle("on", o === b); }); }; });
    $("go").onclick = function () {
      var u = cleanUser($("ru").value); if (!validUser(u)) return toast("Add your GitHub username first");
      var place = $("rp").value.trim() || "our " + c.name.toLowerCase(), n = Math.max(1, parseInt($("rn").value, 10) || 1), d = $("rd").value || today();
      var tips = (k ? k.tips : COMM_TIPS[c.id].slice(0, 3)).map(function (t, i) { return (i + 1) + ". " + TIPS[t][k ? k.lang : "en"]; }).join("\n");
      var squadList = (S.squad.members.length ? S.squad.members : [u]).map(function (x) { return "@" + x; }).join(", ");
      var body = "---\ntitle: Cyber awareness session at " + place + "\nauthor: " + u + "\ntrack: community\ncommunity: " + c.id + "\ndate: " + d + "\nlanguage: " + (k && k.lang === "pcm" ? "pcm" : "en") + "\npeople_reached: " + n + "\n---\n\n# Cyber awareness session: " + place + "\n\n## Who we reached\n\n" + n + " people (" + c.who.toLowerCase() + ").\n\n## What we shared\n\n" + tips + "\n\n## What people asked\n\n" + ($("rq").value.trim() || "(Write what people asked or shared, without naming anyone.)") + "\n\n## What we learned\n\n(What worked, and what you would do differently next time.)\n\n## Squad\n\n" + squadList + "\n";
      var path = "community/sessions/" + u.toLowerCase() + "-" + c.id + "-" + d + ".md";
      S.github = u; if (S.reported.indexOf(c.id) === -1) S.reported.push(c.id); S.xp += 100; save();
      window.open(REPO + "/new/main?filename=" + encodeURIComponent(path) + "&value=" + encodeURIComponent(body), "_blank", "noopener");
      closeSheet(); confetti(); toast("+100 XP · report opened on GitHub"); render();
    };
  }

  // ------------------------------------------------------------ Onboarding
  function onboarding() {
    var slide = 0, comm = "market";
    var slides = [
      { art: "shield", col: "#3DDC97", t: "Scams spread fast in our communities", p: "At the market, in church and mosque groups, in schools and on family WhatsApp. One message can empty someone's account." },
      { art: "brain", col: "#8B7CFF", t: "Practise the moments that matter", p: "Make real-life security decisions, triage alerts in a SOC console, find flaws in a red team lab and build an uncrackable passphrase." },
      { art: "mega", col: "#FFB547", t: "Protect your people. Earn real badges.", p: "Build an awareness kit, run a session with your squad, then contribute it to the CyberSecTOBER library for verified badges." }
    ];
    function draw() {
      if (slide < slides.length) {
        var s = slides[slide];
        $("onb").innerHTML = '<div class="logo">' + ic("shield", "#3DDC97", 24) + 'SHIELD UP <span class="chip" style="margin-left:auto">CyberSecTOBER</span></div><div class="art"><div class="orb">' + ic(s.art, s.col, 96) + "</div></div><h1>" + s.t + "</h1><p>" + s.p + '</p><div class="dots">' + slides.map(function (_, i) { return '<i class="' + (i === slide ? "on" : "") + '"></i>'; }).join("") + '<i></i></div><button class="btn block" id="nx">' + (slide === slides.length - 1 ? "Get started" : "Next") + '</button><button class="btn ghost block" id="skip" style="margin-top:8px;background:none">Skip</button>';
        $("nx").onclick = function () { slide++; draw(); }; $("skip").onclick = function () { slide = slides.length; draw(); };
      } else {
        $("onb").innerHTML = '<div class="logo">' + ic("shield", "#3DDC97", 24) + "SHIELD UP</div><h1 style=\"margin-top:26px\">Let's set you up</h1>" +
          '<label class="lbl" for="on">Your first name</label><input id="on" maxlength="20" placeholder="e.g. Tolu">' +
          '<label class="lbl" for="og">GitHub username <span style="font-weight:500">(optional, for real badges)</span></label><input id="og" placeholder="you can add it later" autocapitalize="off" spellcheck="false" value="' + esc(store.get("cybersectober-user") || "") + '">' +
          '<div class="lbl">Who do you want to protect first?</div><div class="opts">' + COMMS.map(function (c) { return '<button class="opt' + (c.id === comm ? " on" : "") + '" data-c="' + c.id + '">' + ic(c.icon, c.col, 22) + "<b style=\"margin-top:6px\">" + esc(c.name) + "</b><span>" + esc(c.who) + "</span></button>"; }).join("") + "</div>" +
          '<button class="btn block" id="go" style="margin-top:20px">Start protecting</button>';
        $("onb").querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { comm = b.dataset.c; var n = $("on").value, g = $("og").value; draw(); $("on").value = n; $("og").value = g; }; });
        $("go").onclick = function () {
          var n = $("on").value.trim() || "Friend", g = cleanUser($("og").value);
          S = blank(n, validUser(g) ? g : "", comm); joinSquadFromLink(); save(); $("onb").classList.remove("on"); go("home"); toast("Welcome, " + n + "!");
        };
      }
    }
    $("onb").classList.add("on"); draw();
  }
  function joinSquadFromLink() {
    var q = new URLSearchParams(location.search), name = q.get("squad"), m = (q.get("m") || "").split(",").map(cleanUser).filter(validUser);
    if (!name) return;
    S.squad.name = name.slice(0, 40); m.forEach(function (u) { if (S.squad.members.map(function (x) { return x.toLowerCase(); }).indexOf(u.toLowerCase()) === -1) S.squad.members.push(u); });
    if (S.github && S.squad.members.indexOf(S.github) === -1) S.squad.members.push(S.github);
    toast("You joined the squad " + S.squad.name);
  }

  if (S) {
    if (S.days.indexOf(today()) === -1) S.days.push(today());
    if (new URLSearchParams(location.search).get("squad") && confirm("Join the squad \"" + new URLSearchParams(location.search).get("squad") + "\"?")) joinSquadFromLink();
    go("home");
  } else onboarding();
})();
</script>
